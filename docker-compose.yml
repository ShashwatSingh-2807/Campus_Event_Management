services:
  db:
    image: postgres:17-alpine
    container_name: campusloop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusloop}
      POSTGRES_USER: ${POSTGRES_USER:-campusloop}
      # Local-development password only. Use managed secrets in deployed environments.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusloop_local_only}
    ports:
      - "5432:5432"
    volumes:
      - campusloop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusloop} -d ${POSTGRES_DB:-campusloop}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusloop_postgres_data:
